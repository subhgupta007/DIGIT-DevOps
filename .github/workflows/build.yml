name: Build Pipeline
run-name: Build ${{ github.event.inputs.pipeline_name }}

on:
  workflow_dispatch:
    inputs:
      pipeline_name:
        description: "Name of the config pipeline to build and deploy"
        required: true
        type: choice
        options:
          #- pgr-services
          #- default-data-handler
          #- digit-ui
          - digit-ui
          - tl-services
          - tl-calculator
          - gateway

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_ACCESS_TOKEN }}

jobs:
  resolve-config:
    name: Resolve config for ${{ github.event.inputs.pipeline_name }}
    runs-on: ubuntu-latest
    outputs:
      service_work_dir: ${{ steps.setenv.outputs.SERVICE_WORK_DIR }}
      service_image_name: ${{ steps.setenv.outputs.SERVICE_IMAGE_NAME }}
      service_dockerfile: ${{ steps.setenv.outputs.SERVICE_DOCKERFILE }}
      db_folder_exists: ${{ steps.check-db-folder.outputs.folder_exists }}
      db_work_dir: ${{ steps.setenv.outputs.DB_WORK_DIR }}
      db_image_name: ${{ steps.setenv.outputs.DB_IMAGE_NAME }}
      db_dockerfile: ${{ steps.setenv.outputs.DB_DOCKERFILE }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout Citizen Complaint Resolution System
        uses: actions/checkout@v3

      - name: Checkout URBAN (for TL services and TL UI)
        if: ${{ github.event.inputs.pipeline_name == 'tl-services' || github.event.inputs.pipeline_name == 'tl-calculator' || github.event.inputs.pipeline_name == 'digit-ui' }}
        uses: actions/checkout@v4
        with:
          repository: subhgupta007/URBAN
          ref: master
          path: urban-src

      - name: Checkout UPYOG TL (for core gateway)
        if: ${{ github.event.inputs.pipeline_name == 'gateway' }}
        uses: actions/checkout@v4
        with:
          repository: bdhal1989/UPYOG_TL
          ref: master
          path: upyog-src

      - name: Install yq
        run: |
          VERSION="4.30.8"
          URL="https://github.com/mikefarah/yq/releases/download/v${VERSION}/yq_linux_amd64"
          sudo curl -sSL "$URL" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve env from build-config.yml
        id: setenv
        run: |
          set -euo pipefail

          PIPELINE_NAME="${{ github.event.inputs.pipeline_name }}"
          DEFAULT_DOCKERFILE="Dockerfile"

          echo "### Pipeline Name: $PIPELINE_NAME" >> "$GITHUB_STEP_SUMMARY"

          MATCHING_CONFIGS=$(yq eval -o=json '.config[] | select(.name | test("/'"$PIPELINE_NAME"'$"))' build/build-config.yml)
          echo "Matching config(s) for pipeline '$PIPELINE_NAME':"
          echo "$MATCHING_CONFIGS" | yq eval -P -

          MATCH_COUNT=$(echo "$MATCHING_CONFIGS" | yq eval -o=json '.' - | jq -s 'length')
          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 matching pipeline config, but found $MATCH_COUNT"
            exit 1
          fi

          SERVICE_BUILD_CONFIG=$(yq eval -o=json '
            .config[]
            | select(.name | test("/'"$PIPELINE_NAME"'$"))
            | .build[]
            | select(.["image-name"] | test("-db$") | not)
          ' build/build-config.yml)

          DB_BUILD_CONFIG=$(yq eval -o=json '
            .config[]
            | select(.name | test("/'"$PIPELINE_NAME"'$"))
            | .build[]
            | select(.["image-name"] | test("-db$"))
          ' build/build-config.yml)

          echo "SERVICE_BUILD_CONFIG: $SERVICE_BUILD_CONFIG"
          echo "DB_BUILD_CONFIG: $DB_BUILD_CONFIG"

          SERVICE_DOCKERFILE=$(echo "$SERVICE_BUILD_CONFIG" | yq eval -r '.dockerfile // ""' -)
          SERVICE_IMAGE_NAME=$(echo "$SERVICE_BUILD_CONFIG" | yq eval -r '.["image-name"] // ""' -)
          SERVICE_WORK_DIR=$(echo "$SERVICE_BUILD_CONFIG" | yq eval -r '.["work-dir"] // ""' -)

          DB_IMAGE_NAME=$(echo "$DB_BUILD_CONFIG" | yq eval -r '.["image-name"] // ""' -)
          DB_WORK_DIR=$(echo "$DB_BUILD_CONFIG" | yq eval -r '.["work-dir"] // ""' -)
          if [ -n "$DB_WORK_DIR" ]; then
            DB_DOCKERFILE="${DB_WORK_DIR%/}/Dockerfile"
          else
            DB_DOCKERFILE=""
          fi

          if [ -z "$SERVICE_DOCKERFILE" ]; then
            echo "No dockerfile entry found for '$PIPELINE_NAME', using default Dockerfile inside work dir"
            SERVICE_DOCKERFILE="${SERVICE_WORK_DIR%/}/$DEFAULT_DOCKERFILE"
          fi

          missing_vars=()
          for var in SERVICE_WORK_DIR SERVICE_IMAGE_NAME SERVICE_DOCKERFILE; do
            if [ -z "${!var}" ]; then
              missing_vars+=("$var")
            fi
          done
          if [ "${#missing_vars[@]}" -gt 0 ]; then
            echo "ERROR: Required values are missing: ${missing_vars[*]}"
            exit 1
          fi

          if [ ! -d "$SERVICE_WORK_DIR" ]; then
            echo "ERROR: Service work dir not found: $SERVICE_WORK_DIR"
            exit 1
          fi

          if [ ! -f "$SERVICE_DOCKERFILE" ]; then
            echo "ERROR: Dockerfile not found: $SERVICE_DOCKERFILE"
            exit 1
          fi

          echo "SERVICE_WORK_DIR=$SERVICE_WORK_DIR"         >> "$GITHUB_OUTPUT"
          echo "SERVICE_IMAGE_NAME=$SERVICE_IMAGE_NAME"     >> "$GITHUB_OUTPUT"
          echo "SERVICE_DOCKERFILE=$SERVICE_DOCKERFILE"     >> "$GITHUB_OUTPUT"
          echo "DB_WORK_DIR=$DB_WORK_DIR"                   >> "$GITHUB_OUTPUT"
          echo "DB_IMAGE_NAME=$DB_IMAGE_NAME"               >> "$GITHUB_OUTPUT"
          echo "DB_DOCKERFILE=$DB_DOCKERFILE"               >> "$GITHUB_OUTPUT"

          {
            echo "#### Application Config Summary"
            echo "Work Directory: $SERVICE_WORK_DIR"
            echo "Image Name: $SERVICE_IMAGE_NAME"
            echo "Dockerfile Path: $SERVICE_DOCKERFILE"
            echo ""
            echo "#### DB Config Summary"
            echo "DB Work Directory: ${DB_WORK_DIR:-<none>}"
            echo "DB Image Name: ${DB_IMAGE_NAME:-<none>}"
            echo "DB Dockerfile Path: ${DB_DOCKERFILE:-<none>}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check if DB folder exists
        id: check-db-folder
        run: |
          FOLDER_PATH="${{ steps.setenv.outputs.DB_WORK_DIR }}"
          if [ -n "$FOLDER_PATH" ] && [ -d "$FOLDER_PATH" ]; then
            echo "folder_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "folder_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the tag
        id: tag
        run: |
          set -euo pipefail

          PIPELINE_NAME="${{ github.event.inputs.pipeline_name }}"

          if [ "$PIPELINE_NAME" = "gateway" ]; then
            cd upyog-src
            COMMIT_HASH="$(git rev-parse --short HEAD)"
            BRANCH="master"
            cd -
          else
            COMMIT_HASH="$(git rev-parse --short HEAD)"
            BRANCH="${GITHUB_REF##*/}"
          fi

          TAG="${BRANCH}-${COMMIT_HASH}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Tag: $TAG" >> "$GITHUB_STEP_SUMMARY"

  build-matrix:
    name: Build image for ${{ matrix.arch }}
    needs: resolve-config
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    outputs:
      amd64_digest: ${{ steps.digest_amd64.outputs.digest }}
      amd64_digest_db: ${{ steps.digest_db_amd64.outputs.digest }}

    steps:
      - name: Checkout Citizen Complaint Resolution System
        uses: actions/checkout@v3

      - name: Checkout URBAN (for TL services and TL UI)
        if: ${{ github.event.inputs.pipeline_name == 'tl-services' || github.event.inputs.pipeline_name == 'tl-calculator' || github.event.inputs.pipeline_name == 'digit-ui' }}
        uses: actions/checkout@v4
        with:
          repository: subhgupta007/URBAN
          ref: master
          path: urban-src

      - name: Checkout UPYOG TL (for core gateway)
        if: ${{ github.event.inputs.pipeline_name == 'gateway' }}
        uses: actions/checkout@v4
        with:
          repository: bdhal1989/UPYOG_TL
          ref: master
          path: upyog-src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure cache dir exists
        run: |
          mkdir -p /tmp/.buildx-cache

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-buildx-${{ github.event.inputs.pipeline_name }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-buildx-${{ github.event.inputs.pipeline_name }}-

      - name: Debug Docker username
        run: |
          if [ -z "${DOCKER_USERNAME:-}" ]; then
            echo "DOCKER_USERNAME is empty, check GitHub secrets"
            exit 1
          fi
          echo "Docker username is set"

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push application image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg WORK_DIR="${{ needs.resolve-config.outputs.service_work_dir }}" \
            --file "${{ needs.resolve-config.outputs.service_dockerfile }}" \
            --tag "${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.service_image_name }}:${{ needs.resolve-config.outputs.tag }}-${{ matrix.arch }}" \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache,mode=max \
            --push \
            --iidfile digest.txt \
            .

      - name: Build and push DB image
        if: ${{ needs.resolve-config.outputs.db_folder_exists == 'true' }}
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg WORK_DIR="${{ needs.resolve-config.outputs.db_work_dir }}" \
            --file "${{ needs.resolve-config.outputs.db_dockerfile }}" \
            --tag "${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.db_image_name }}:${{ needs.resolve-config.outputs.tag }}-${{ matrix.arch }}" \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache,mode=max \
            --push \
            --iidfile db-digest.txt \
            "${{ needs.resolve-config.outputs.db_work_dir }}"

      - name: Inspect service image
        run: |
          docker buildx imagetools inspect \
            "${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.service_image_name }}:${{ needs.resolve-config.outputs.tag }}-${{ matrix.arch }}"

      - name: Inspect DB image
        if: ${{ needs.resolve-config.outputs.db_folder_exists == 'true' }}
        run: |
          docker buildx imagetools inspect \
            "${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.db_image_name }}:${{ needs.resolve-config.outputs.tag }}-${{ matrix.arch }}"

      - name: Export digest service (amd64)
        if: matrix.arch == 'amd64'
        id: digest_amd64
        run: |
          digest=$(docker buildx imagetools inspect \
            "${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.service_image_name }}:${{ needs.resolve-config.outputs.tag }}-${{ matrix.arch }}" \
            --format '{{json .}}' | jq -r '.manifest.manifests[] | select(.platform.architecture=="amd64") | .digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Export digest DB (amd64)
        if: matrix.arch == 'amd64' && needs.resolve-config.outputs.db_folder_exists == 'true'
        id: digest_db_amd64
        run: |
          digest=$(docker buildx imagetools inspect \
            "${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.db_image_name }}:${{ needs.resolve-config.outputs.tag }}-${{ matrix.arch }}" \
            --format '{{json .}}' | jq -r '.manifest.manifests[] | select(.platform.architecture=="amd64") | .digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  create-manifest:
    name: Create and push manifest
    needs:
      - resolve-config
      - build-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Create and push manifest (application)
        run: |
          set -euxo pipefail

          IMAGE_BASE="${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.service_image_name }}"
          TAG="${{ needs.resolve-config.outputs.tag }}"
          AMD64_DIGEST="${{ needs.build-matrix.outputs.amd64_digest }}"

          if [ -z "$AMD64_DIGEST" ]; then
            echo "ERROR: amd64 digest is empty, cannot create manifest"
            exit 1
          fi

          docker manifest create \
            "${IMAGE_BASE}:${TAG}" \
            --amend "${IMAGE_BASE}@${AMD64_DIGEST}"

          docker manifest push "${IMAGE_BASE}:${TAG}"

      - name: Create and push manifest (DB)
        if: needs.resolve-config.outputs.db_folder_exists == 'true'
        run: |
          set -euxo pipefail

          IMAGE_BASE_DB="${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.db_image_name }}"
          TAG="${{ needs.resolve-config.outputs.tag }}"
          AMD64_DIGEST_DB="${{ needs.build-matrix.outputs.amd64_digest_db }}"

          if [ -z "$AMD64_DIGEST_DB" ]; then
            echo "ERROR: amd64 db digest is empty, cannot create db manifest"
            exit 1
          fi

          docker manifest create \
            "${IMAGE_BASE_DB}:${TAG}" \
            --amend "${IMAGE_BASE_DB}@${AMD64_DIGEST_DB}"

          docker manifest push "${IMAGE_BASE_DB}:${TAG}"

      - name: Cleanup local manifest refs (application)
        run: |
          docker manifest rm "${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.service_image_name }}:${{ needs.resolve-config.outputs.tag }}-amd64" || true

      - name: Cleanup local manifest refs (DB)
        if: needs.resolve-config.outputs.db_folder_exists == 'true'
        run: |
          docker manifest rm "${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.db_image_name }}:${{ needs.resolve-config.outputs.tag }}-amd64" || true

      - name: Add summary (application)
        run: |
          echo "### Application Docker Manifest Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.service_image_name }}:${{ needs.resolve-config.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: amd64" >> "$GITHUB_STEP_SUMMARY"

      - name: Add summary (DB)
        if: needs.resolve-config.outputs.db_folder_exists == 'true'
        run: |
          echo "### DB Docker Manifest Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${DOCKER_USERNAME}/${{ needs.resolve-config.outputs.db_image_name }}:${{ needs.resolve-config.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: amd64" >> "$GITHUB_STEP_SUMMARY"